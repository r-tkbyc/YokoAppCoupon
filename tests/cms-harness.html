<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>cms_inject.js 反映テスト</title></head>
<body>
<div id="root"></div>
<pre id="testout"></pre>
<script type="module">
const out = [];
const say = s => out.push(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const dump = () => { document.getElementById('testout').textContent = out.join('\n'); };

try {
  const React    = await import('https://esm.sh/react@18.3.1');
  const ReactDOM = await import('https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1');
  const M        = await import('https://esm.sh/@mantine/core@7.17.4?deps=react@18.3.1,react-dom@18.3.1');

  const h = React.createElement;
  const { useState } = React;

  // ---- CMSのフォームを模したモック ----
  function Form(){
    const [title, setTitle]   = useState('');
    const [admin, setAdmin]   = useState('');
    const [grp, setGrp]       = useState(null);
    const [cat, setCat]       = useState(null);
    const [dist, setDist]     = useState(null);
    const [floor, setFloor]   = useState('');
    const [brand, setBrand]   = useState('');
    const [prio, setPrio]     = useState(0);
    const [perUser, setPerUser] = useState(1);
    const [limitOn, setLimitOn] = useState(false);
    const [total, setTotal]   = useState(1);

    return h(M.MantineProvider, null,
      h(M.Stack, null,
        h(M.TextInput,   { label:'タイトル',   value:title, onChange:e=>setTitle(e.currentTarget.value) }),
        h(M.TextInput,   { label:'管理名称',   value:admin, onChange:e=>setAdmin(e.currentTarget.value) }),
        h(M.Select,      { label:'表示グループ', data:['グループA','グループB'], value:grp, onChange:setGrp }),
        h(M.Select,      { label:'カテゴリ',   data:['カテゴリA','カテゴリB'], value:cat, onChange:setCat }),
        h(M.Select,      { label:'配布方法',   data:['自動配布','手動配布'], value:dist, onChange:setDist }),
        h(M.TextInput,   { label:'ブランド入居フロア', value:floor, onChange:e=>setFloor(e.currentTarget.value) }),
        h(M.TextInput,   { label:'ブランド名', value:brand, onChange:e=>setBrand(e.currentTarget.value) }),
        h(M.Input.Wrapper, { label:'ご利用条件' },
          h('div', { className:'tiptap ProseMirror', contentEditable:true, suppressContentEditableWarning:true }, h('p', null, ''))),
        h(M.Input.Wrapper, { label:'注意事項' },
          h('div', { className:'tiptap ProseMirror', contentEditable:true, suppressContentEditableWarning:true }, h('p', null, ''))),
        h(M.NumberInput, { label:'並べ替え優先度', min:0, max:99, value:prio, onChange:setPrio }),
        h(M.NumberInput, { label:'会員ひとりが利用可能な回数', min:1, value:perUser, onChange:setPerUser }),
        h(M.Switch,      { label:'全体の利用回数制限', checked:limitOn, onChange:e=>setLimitOn(e.currentTarget.checked) }),
        h(M.NumberInput, { label:'全体で利用可能な回数', min:1, value:total, onChange:setTotal }),
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Form));
  await wait(500);

  // ---- chrome API のスタブ ----
  const listeners = [];
  window.chrome = { runtime: { onMessage: {
    addListener:    (fn) => { listeners.push(fn); },
    removeListener: (fn) => { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); },
  } } };

  const loadInject = () => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = encodeURI('../YokoAppCoupon to CMS/cms_inject.js');
    s.onload = res;
    s.onerror = () => rej(new Error('cms_inject.js を読み込めなかった'));
    document.head.appendChild(s);
  });

  // ---- 二重注入しても listener は1つだけであること ----
  // background.js は "Receiving end does not exist" のとき executeScript で
  // 注入し直す。既に載っているところへ来ても二重登録してはいけない。
  await loadInject();
  if (listeners.length !== 1) throw new Error(`1回目で listener が ${listeners.length} 個`);
  await loadInject();
  say(`cms_inject.js 二重読み込み後の listener 数 = ${listeners.length} （1 が正しい）`);
  let dupFail = 0;
  if (listeners.length !== 1){ dupFail = 1; say('  NG  二重登録されている'); }

  const listener = listeners[0];
  if (!listener) throw new Error('onMessage.addListener が呼ばれなかった');

  // ---- koma_inject.js が組み立てるのと同じ形の payload ----
  //
  // title の末尾改行は意図的。ツール側は textarea（.output-title）から値を取るため
  // 改行が混ざりうるが、<input type="text"> は value sanitization で CR/LF を落とす。
  // 期待値をそれに合わせていないと「NG:入れたが戻された」と誤判定する（実機で発生）。
  const payload = {
    title: 'テストタイトル\n', adminName: 'テスト管理名称',
    division: '1階', firstCome: '30',
    displayGroup: 'グループA', category: 'カテゴリB',
    brandFloor: '3階 婦人服', brandName: 'テストブランド',
    terms: '利用条件の1行目\n2行目', notes: '注意事項の1行目',
    publishStart: '2026/09/05 17:00', publishEnd: '2026/09/10 20:00',
    usableStart:  '2026/09/06 10:00', usableEnd:  '2026/09/10 20:00',
    distributionMethod: '自動配布',
    sortPriority: '98',
    perUser: '3',
    totalLimitEnabled: true, totalCount: '30'
  };

  const res = await new Promise((resolve) => {
    listener({ type: 'YK_COUPON_TO_CMS', payload }, {}, resolve);
  });

  say('');
  say('---- sendResponse ----');
  say('  ok=' + res.ok + ' changed=' + res.changed);

  say('');
  say('---- report ----');
  (res.report || []).forEach(r => say(`  ${String(r.項目).padEnd(16,'　')} ${String(r.結果).padEnd(20,' ')} ${r.詳細}`));

  // ---- 実際の画面の値を確認 ----
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const normText = s => (s||'').replace(/\s+/g,' ').trim();
  const readByLabel = (t) => {
    const lb = $$('label').find(l => normText(l.textContent).includes(t));
    if (!lb) return '(ラベル無し)';
    const sc = lb.closest('.mantine-InputWrapper-root') || lb.parentElement;
    const i = sc && sc.querySelector('input, textarea');
    const pm = sc && sc.querySelector('.ProseMirror');
    if (pm) return JSON.stringify(normText(pm.textContent));
    return i ? JSON.stringify(i.value) : '(input無し)';
  };

  say('');
  say('---- 画面の実値 ----');
  const EXPECT = {
    'タイトル': '"テストタイトル"',
    '管理名称': '"テスト管理名称"',
    '表示グループ': '"グループA"',
    'カテゴリ': '"カテゴリB"',
    '配布方法': '"自動配布"',
    'ブランド入居フロア': '"3階 婦人服"',
    'ブランド名': '"テストブランド"',
    // <p>…</p><p>…</p> なので textContent には区切りが入らない
    'ご利用条件': '"利用条件の1行目2行目"',
    '注意事項': '"注意事項の1行目"',
    '並べ替え優先度': '"98"',
    '会員ひとりが利用可能な回数': '"3"',
    '全体で利用可能な回数': '"30"',
  };
  let fail = dupFail;
  for (const [k, want] of Object.entries(EXPECT)){
    const got = readByLabel(k);
    const ok = got === want;
    if (!ok) fail++;
    say(`  ${ok ? 'OK ' : 'NG '} ${k.padEnd(16,'　')} 期待=${want}  実際=${got}`);
  }
  const sw = document.querySelector("input[type='checkbox'][role='switch']");
  const swOK = sw && sw.checked === true;
  if (!swOK) fail++;
  say(`  ${swOK ? 'OK ' : 'NG '} 全体の利用回数制限        期待=ON  実際=${sw ? (sw.checked?'ON':'OFF') : '(無し)'}`);

  // ---- report の妥当性 ----
  // 日時ピッカーはモックに置いていないので、この2件だけがNGになるのが正しい状態。
  // それ以外にNGが出たら、値は入っていても報告が誤っている（＝誤判定）。
  say('');
  say('---- report のNG（日時2件だけが正しい） ----');
  const ALLOWED_NG = ['公開期間', '利用可能期間'];
  const ngRows = (res.report || []).filter(r => String(r.結果).startsWith('NG'));
  ngRows.forEach(r => {
    const allowed = ALLOWED_NG.includes(r.項目);
    if (!allowed) fail++;
    say(`  ${allowed ? 'OK ' : 'NG '} ${r.項目} : ${r.結果} ${r.詳細}`);
  });
  ALLOWED_NG.forEach(k => {
    if (!ngRows.some(r => r.項目 === k)){ fail++; say(`  NG  ${k} がNGとして報告されていない`); }
  });

  say('');
  say(fail === 0 ? '>>> 全パス' : `>>> 失敗 ${fail} 件`);
} catch (e) {
  say('!!! 例外: ' + (e && e.stack || e));
}
dump();
</script>
</body>
</html>
